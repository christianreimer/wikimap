<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WikiMap</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    #container { position: relative; width: 100%; height: 100%; }
    canvas { display: block; width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
    #labels { pointer-events: none; }
    .zoom-controls {
      position: absolute;
      bottom: 24px;
      right: 24px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 10;
    }
    .zoom-btn {
      width: 36px;
      height: 36px;
      border: 1px solid #ccc;
      background: white;
      border-radius: 4px;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    }
    .zoom-btn:hover { background: #f0f0f0; }
    .zoom-btn:active { background: #e0e0e0; }

    .theme-toggle {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 36px;
      height: 36px;
      border: 1px solid #ccc;
      background: white;
      border-radius: 4px;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 1px 4px rgba(0,0,0,0.15);
      z-index: 10;
    }
    .theme-toggle:hover { background: #f0f0f0; }
    .theme-toggle:active { background: #e0e0e0; }

    /* Dark mode overrides */
    body.dark .zoom-btn {
      background: #2a2a2e;
      border-color: #555;
      color: #ddd;
      box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    }
    body.dark .zoom-btn:hover { background: #3a3a3e; }
    body.dark .zoom-btn:active { background: #444; }

    body.dark .theme-toggle {
      background: #2a2a2e;
      border-color: #555;
      color: #ddd;
      box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    }
    body.dark .theme-toggle:hover { background: #3a3a3e; }
    body.dark .theme-toggle:active { background: #444; }
  </style>
</head>
<body>
  <div id="container">
    <canvas id="map"></canvas>
    <canvas id="labels"></canvas>
    <button class="theme-toggle" id="theme-toggle" title="Toggle dark/light mode">&#9681;</button>
    <div class="zoom-controls">
      <button class="zoom-btn" id="zoom-in">+</button>
      <button class="zoom-btn" id="zoom-out">&minus;</button>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
